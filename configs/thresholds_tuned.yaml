# =============================================================================
# FILE: configs/thresholds_tuned.yaml
# PURPOSE: Optimized and tuned configuration parameters for production and
#          live teacher demonstrations (Phase 6).
# =============================================================================

app:
  debug: false
  version: "1.0.0-submission"
  name: "ShadowMind"

auth:
  max_login_attempts: 5
  lockout_duration_seconds: 300
  session_ttl_seconds: 28800
  bcrypt_rounds: 12
  min_password_length: 10

detection:
  risk_score:
    benign_max: 0.35
    suspicious_min: 0.36
    confirmed_min: 0.75

  slow_exfil:
    max_packet_kb: 5.0
    beacon_interval_min_sec: 60
    off_hours_start: 20
    off_hours_end: 6

  cnn:
    outbound_spike_mb: 50.0
    unusual_port_fan_out: 10

  lstm:
    sequence_length: 50
    anomaly_threshold: 0.6

  gnn:
    message_passing_steps: 3
    graph_anomaly_threshold: 0.5

vault:
  aes_key_bits: 256
  key_rotation_on_breach: true
  rotation_timeout_ms: 300       # Tuned for sub-300ms response
  ttl_wipe_on_logoff: true
  protected_extensions:
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".csv"
    - ".db"
    - ".sqlite"
    - ".txt"
    - ".json"
    - ".enc"

honeypot:
  enabled: true
  decoy_count: 5
  redirect_on_suspicious: true
  interaction_log_max_lines: 10000

data:
  synthetic:
    benign_samples: 5000
    malicious_samples: 1000
    random_seed: 42
  output_path: "data/processed/synthetic_traffic.csv"
  graph_output_path: "data/processed/synthetic_graph.json"

logging:
  level: "INFO"
  log_to_file: true
  log_path: "logs/shadowmind.log"
  max_log_size_mb: 10
  backup_count: 3
